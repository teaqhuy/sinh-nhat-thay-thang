<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sinh nhật thầy Thắng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap">
<style>
@font-face{font-family:'Dancing Script';font-style:normal;font-weight:600 700;font-display:swap;src:url(fonts/ds-vi.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'Dancing Script';font-style:normal;font-weight:600 700;font-display:swap;src:url(fonts/ds-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Layout idea: one full-screen stage, cinema look. Four scenes stacked on it:
   intro -> 3D cake (one press lights all 26 candles) -> film roll of photos -> fireworks + heart. */
:root{
  --bg:#111111; --ink:#F5F0E6; --muted:#C9C2B4; --hi:#E2B33C; --btn:#C8102E; --btn-ink:#FFFFFF;
  --film:#000000; --hole:#F5F0E6; --frame:#1C1C1C;
  --cake:#C8102E; --cake-shade:#7E0A1D; --frost:#F5F0E6; --drip:#F5F0E6; --plate:#E2B33C;
  --c1:#E2B33C; --c2:#F5F0E6; --c3:#E2B33C; --dark:1;
  --display:'Anton',Impact,'Arial Narrow',sans-serif; --body:'Be Vietnam Pro',system-ui,sans-serif; --script:'Dancing Script','Segoe Script','Brush Script MT',cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);overflow:hidden}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body)}
#cake{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;opacity:0;transition:opacity .7s;cursor:grab}
#app[data-scene="cake"] #cake{opacity:1}

.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;opacity:0;visibility:hidden;transition:opacity .6s,visibility 0s .6s}
#app[data-scene="intro"] .intro,#app[data-scene="cake"] .cakeui,#app[data-scene="memo"] .memo,#app[data-scene="film"] .filmscene,#app[data-scene="finale"] .finale{opacity:1;visibility:visible;transition:opacity .6s}

.eyebrow{margin:0;font-size:12px;font-weight:600;letter-spacing:3px;color:var(--hi)}
.display{margin:0;font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:1px;line-height:1.18;text-wrap:balance}
.display em{font-style:normal;color:var(--hi)}
.btn{min-height:54px;padding:0 34px;border:0;border-radius:4px;background:var(--btn);color:var(--btn-ink);font-family:var(--display);font-size:20px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:transform .15s,opacity .3s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.nav:focus-visible{outline:3px solid var(--hi);outline-offset:3px}

/* intro: a cinema marquee */
.intro{justify-content:center;gap:28px;padding:24px 22px;text-align:center}
.marquee{display:flex;flex-direction:column;gap:12px;align-items:center;padding:26px 22px 24px;border:3px dotted var(--hi);border-radius:6px;max-width:680px}
.marquee .display{font-size:clamp(36px,9.5vw,76px)}
.marquee .sub{margin:0;font-size:14px;letter-spacing:1px;color:var(--muted)}
.intro .btn{min-width:220px}

/* cake scene: the canvas shows through; only the button takes pointer events */
.cakeui{justify-content:space-between;padding:22px 20px 26px;pointer-events:none}
.cakeui .hud{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.cakeui .count{margin:0;font-family:var(--display);font-size:34px;letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1.15}
.cakeui .count small{font-family:var(--body);font-size:14px;font-weight:500;letter-spacing:1px;color:var(--muted)}
.cakeui .foot{display:flex;flex-direction:column;align-items:center;gap:10px}
.cakeui .btn{pointer-events:auto;min-width:240px}
.cakeui .hint{margin:0;font-size:13px;color:var(--muted)}

/* title card before the photos */
.memo{justify-content:center;gap:18px;padding:24px;text-align:center}
.memo .line{margin:0;font-family:var(--script);font-weight:700;font-size:clamp(44px,11vw,92px);line-height:1.2;text-wrap:balance}
.memo .line em{font-style:normal;color:var(--hi)}
.memo .rule{width:120px;height:2px;background:var(--btn)}

/* film scene */
.filmscene{justify-content:center;gap:16px;padding:18px 0 22px}
.filmscene .count{margin:0;font-family:var(--display);font-size:17px;letter-spacing:3px;color:var(--hi);font-variant-numeric:tabular-nums}
.film{width:100%;overflow:hidden;--fw:min(86vw,80vh,900px);border-top:2px solid var(--btn);border-bottom:2px solid var(--btn)}
.track{position:relative;display:flex;gap:12px;width:max-content;padding:30px 12px;background:var(--film);transition:transform 1.1s cubic-bezier(.22,.8,.2,1);will-change:transform}
.track::before,.track::after{content:"";position:absolute;left:0;right:0;height:12px;background:repeating-linear-gradient(90deg,var(--hole) 0 14px,transparent 14px 30px);opacity:.9}
.track::before{top:9px}.track::after{bottom:9px}
.frame{position:relative;flex:0 0 var(--fw);aspect-ratio:3/2;overflow:hidden;background:var(--frame);opacity:.3;transition:opacity .8s}
.frame.on{opacity:1}
.frame .blur{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(18px) brightness(.45)}
.frame img{position:relative;width:100%;height:100%;object-fit:contain;display:block}
.caption{margin:0;padding:0 22px;max-width:36em;min-height:3.2em;text-align:center;font-size:16px;font-weight:500;line-height:1.75;text-wrap:balance;opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s}
.caption span{background:#000;padding:4px 10px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.caption.show{opacity:1;transform:none}
.reel{display:flex;align-items:center;gap:14px}
.nav{width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--muted);border-radius:50%;background:transparent;color:var(--ink);cursor:pointer}
.nav:disabled{opacity:.3;cursor:default}
.nav svg{width:20px;height:20px}
.bar{width:min(46vw,260px);height:4px;background:#333;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--hi);transform-origin:left;transform:scaleX(0)}
.bar i.run{animation:fill linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* finale */
.finale{justify-content:center;gap:14px;padding:16px}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.heart{position:relative;--side:min(94vw,70vh,660px);width:var(--side);height:var(--side);flex:none}
.wish{position:absolute;z-index:2;left:50%;top:46%;width:64%;white-space:nowrap;transform:translate(-50%,-50%) scale(.6);opacity:0;text-align:center;display:flex;flex-direction:column;gap:4px;transition:opacity .9s,transform 1.2s cubic-bezier(.2,1.3,.3,1)}
.finale.go .wish{opacity:1;transform:translate(-50%,-50%)}
.wish .hb{font-family:var(--script);font-weight:700;font-size:calc(var(--side)*.094);line-height:1.15;color:var(--hi)}
.wish .nm{font-family:var(--script);font-weight:700;font-size:calc(var(--side)*.086);line-height:1.2}
.wish .age{font-family:var(--script);font-weight:600;font-size:calc(var(--side)*.06);line-height:1.2;color:var(--ink)}
.thumb{position:absolute;left:50%;top:50%;width:12.5%;aspect-ratio:1;overflow:hidden;background:var(--frame);border:2px solid var(--ink);border-radius:3px;opacity:0;transform:translate(-50%,-50%) scale(.1);transition:left 1.3s cubic-bezier(.2,.9,.25,1),top 1.3s cubic-bezier(.2,.9,.25,1),opacity .6s,transform 1.3s cubic-bezier(.2,.9,.25,1)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.finale .btn{position:relative;min-height:46px;font-size:16px;opacity:0;transition:opacity .8s}
.finale.done .btn{opacity:1}

@media (min-width:900px){
  .cakeui .count{font-size:42px}
  .caption{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  .track,.thumb,.wish,.scene,.caption{transition-duration:.01s}
}
</style>
</head>
<body>
<main id="app" data-scene="intro">
  <canvas id="cake" aria-hidden="true"></canvas>

  <section class="scene intro">
    <div class="marquee">
      <p class="eyebrow">SUẤT CHIẾU ĐẶC BIỆT · 16.11.2026</p>
      <h1 class="display">Chúc mừng sinh nhật <em>thầy Thắng</em></h1>
      <p class="sub">26 ngọn nến · một cuộn phim kỷ niệm</p>
    </div>
    <button class="btn" id="startBtn" type="button">Bắt đầu</button>
  </section>

  <section class="scene cakeui">
    <div class="hud">
      <p class="eyebrow">SINH NHẬT THẦY THẮNG</p>
      <p class="count" id="hudCount" aria-live="polite">00 <small>/ 26 NẾN</small></p>
    </div>
    <div class="foot">
      <button class="btn" id="lightBtn" type="button">Thắp nến</button>
      <p class="hint">Kéo để xoay bánh</p>
    </div>
  </section>

  <section class="scene memo">
    <p class="line">Cùng ôn lại <em>kỷ niệm</em>…</p>
    <div class="rule"></div>
  </section>

  <section class="scene filmscene" id="filmscene">
    <p class="count" id="pCount">01 / 10</p>
    <div class="film" id="film"><div class="track" id="track"></div></div>
    <p class="caption" id="pCap"><span></span></p>
    <div class="reel">
      <button class="nav" id="prevBtn" type="button" aria-label="Ảnh trước"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
      <button class="nav" id="nextBtn" type="button" aria-label="Ảnh tiếp theo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </section>

  <section class="scene finale" id="finale">
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="heart" id="heart">
      <div class="wish"><span class="hb">Happy Birthday</span><span class="age">tuổi 26</span><span class="nm">thầy Thắng</span></div>
    </div>
    <button class="btn" id="againBtn" type="button">Xem lại từ đầu</button>
  </section>
</main>

<script>
(function(){
'use strict';
/* ---------- content: photos in showing order; "text" is the line under each photo ---------- */
var PHOTOS = [
  { n: '01', text: '' },
  { n: '02', text: '' },
  { n: '03', text: '' },
  { n: '04', text: '' },
  { n: '05', text: '' },
  { n: '06', text: '' },
  { n: '07', text: '' },
  { n: '08', text: '' },
  { n: '09', text: '' },
  { n: '10', text: '' }
];
function src(k){ return 'photos/' + PHOTOS[k].n + '.jpg'; }
function tsrc(k){ return 'photos/t' + PHOTOS[k].n + '.jpg'; }

var N = 26, M = PHOTOS.length, TAU = Math.PI * 2;
var app = document.getElementById('app');
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function $(id){ return document.getElementById(id); }
function pad(n){ return (n < 10 ? '0' : '') + n; }

/* ---------- colors ---------- */
var K = {};
function hex(h){ h = h.replace('#',''); if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)]; }
function mul(h, f){ var c = hex(h); return 'rgb(' + Math.min(255,Math.round(c[0]*f)) + ',' + Math.min(255,Math.round(c[1]*f)) + ',' + Math.min(255,Math.round(c[2]*f)) + ')'; }
(function(){
  var cs = getComputedStyle(document.documentElement);
  ['cake','cake-shade','frost','drip','plate','c1','c2','c3','hi','ink'].forEach(function(k){ K[k] = cs.getPropertyValue('--' + k).trim(); });
})();

/* ---------- scenes ---------- */
var scene = 'intro', keepDraw = 0, timers = [];
function setScene(s){ scene = s; keepDraw = performance.now() + 900; app.setAttribute('data-scene', s); }
function later(fn, ms){ var t = setTimeout(fn, ms); timers.push(t); return t; }

/* ---------- 3D cake ---------- */
var cv = $('cake'), ctx = cv.getContext('2d'), fx = $('fx'), fctx = fx.getContext('2d');
var W = 0, H = 0, S = 100, cx = 0, cy = 0, cs = 1, sn = 0;
var PHI = 0.68, SP = Math.sin(PHI), CP = Math.cos(PHI), CAM = 7, HT = 0.56;
function resize(){
  var r = app.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height; cv.width = Math.round(W * d); cv.height = Math.round(H * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
  fx.width = Math.round(W * d); fx.height = Math.round(H * d); fctx.setTransform(d, 0, 0, d, 0, 0);
  if (scene === 'film' && cur >= 0) { track.style.transition = 'none'; track.style.transform = 'translateX(' + offsetFor(cur) + 'px)'; }
}
function pc(x1, y, z1){ var y2 = y*CP + z1*SP, z2 = -y*SP + z1*CP, p = CAM/(CAM + z2); return { x: cx + x1*S*p, y: cy - y2*S*p, p: p, z: z2 }; }
function pw(x, y, z){ return pc(x*cs + z*sn, y, -x*sn + z*cs); }
function ringC(r, y){ var a = [], n = 72; for (var i = 0; i < n; i++){ var t = i/n*TAU; a.push(pc(Math.cos(t)*r, y, Math.sin(t)*r)); } return a; }
function poly(pts){ ctx.beginPath(); for (var i = 0; i < pts.length; i++){ if (i) ctx.lineTo(pts[i].x, pts[i].y); else ctx.moveTo(pts[i].x, pts[i].y); } ctx.closePath(); }
function cyl(r, y0, y1, base, shade, topFill){
  var L0 = pc(-r,y0,0), R0 = pc(r,y0,0), L1 = pc(-r,y1,0), R1 = pc(r,y1,0);
  var g = ctx.createLinearGradient(L0.x, 0, R0.x, 0);
  g.addColorStop(0, shade); g.addColorStop(.3, base); g.addColorStop(.62, base); g.addColorStop(1, shade);
  ctx.fillStyle = g;
  poly(ringC(r, y0)); ctx.fill();
  ctx.beginPath(); ctx.moveTo(L1.x,L1.y); ctx.lineTo(R1.x,R1.y); ctx.lineTo(R0.x,R0.y); ctx.lineTo(L0.x,L0.y); ctx.closePath(); ctx.fill();
  poly(ringC(r, y1)); ctx.fillStyle = topFill; ctx.fill();
}
/* 26 candles: 16 on the outer ring, 9 on the inner ring, the last one in the centre */
var candles = [];
(function(){
  var k = 0;
  function add(r, a){ candles.push({ x: Math.cos(a)*r, z: Math.sin(a)*r, h: 0.40 + ((k*7) % 5)*0.022, ci: k % 3, lit: false, t0: 0 }); k++; }
  for (var i = 0; i < 16; i++) add(0.76, -Math.PI/2 + i/16*TAU);
  for (var j = 0; j < 9; j++) add(0.42, -Math.PI/2 + (j + 0.5)/9*TAU);
  add(0, 0);
})();
var lit = 0, busy = false, yawBase = 0, tw = null, sparks = [];
function igk(c, now){ if (!c.lit) return 0; var e = (now - c.t0)/650; if (e >= 1) return 1; e = e - 1; return Math.max(0, 1 + 2.70158*e*e*e + 1.70158*e*e); }
function flame(x, y, fs, sway){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var g = ctx.createRadialGradient(x, y - fs, 0, x, y - fs, fs*5.5);
  g.addColorStop(0, 'rgba(255,180,70,.42)'); g.addColorStop(1, 'rgba(255,180,70,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y - fs, fs*5.5, 0, TAU); ctx.fill();
  ctx.restore();
  var tx = x + sway, ty = y - fs*3.1;
  ctx.beginPath(); ctx.moveTo(tx, ty);
  ctx.bezierCurveTo(x + fs*1.25, y - fs*1.3, x + fs*1.05, y + fs*.55, x, y + fs*.55);
  ctx.bezierCurveTo(x - fs*1.05, y + fs*.55, x - fs*1.25, y - fs*1.3, tx, ty);
  g = ctx.createRadialGradient(x, y - fs*.3, 0, x, y - fs*.9, fs*2.4);
  g.addColorStop(0, '#fffbe8'); g.addColorStop(.38, '#ffd35c'); g.addColorStop(1, '#ff7a1a');
  ctx.fillStyle = g; ctx.fill();
}
function drawCake(now){
  ctx.clearRect(0, 0, W, H);
  var top = 96, bot = 150, Hh = Math.max(180, H - top - bot);
  S = Math.min(W*0.38, Hh*0.42); cx = W/2; cy = top + Hh/2 + 0.285*S;
  if (tw){
    var e = Math.min(1, (now - tw.t0)/tw.dur), s = e < .5 ? 2*e*e : 1 - Math.pow(-2*e + 2, 2)/2;
    yawBase = tw.from + (tw.to - tw.from)*s;
    if (e >= 1) tw = null;
  }
  var yaw = yawBase + (reduce ? 0 : Math.sin(now*0.0006)*0.09);
  cs = Math.cos(yaw); sn = Math.sin(yaw);
  var glow = 0, i; for (i = 0; i < N; i++) glow += Math.min(1, igk(candles[i], now));
  glow /= N;
  var dim = 0.6 + 0.4*glow;                      /* the cake brightens as candles are lit */
  var c0 = pc(0, HT, 0), g;
  if (glow > 0){
    g = ctx.createRadialGradient(c0.x, c0.y, 0, c0.x, c0.y, S*2.8);
    g.addColorStop(0, 'rgba(255,190,90,' + (.30*glow + .03) + ')'); g.addColorStop(1, 'rgba(255,190,90,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.save(); poly(ringC(1.33, -0.06)); ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = S*0.28; ctx.fill(); ctx.restore();
  cyl(1.22, -0.06, 0, mul(K.plate, dim), mul(K.plate, dim*.62), mul(K.plate, dim));
  g = ctx.createRadialGradient(c0.x, c0.y, 0, c0.x, c0.y, S*1.05);
  g.addColorStop(0, mul(K.frost, dim)); g.addColorStop(1, mul(K.drip, dim*.94));
  cyl(1, 0, HT, mul(K.cake, dim), mul(K['cake-shade'], dim), g);
  /* piped pearls round the base: they turn with the cake */
  for (i = 0; i < 30; i++){
    var a = i/30*TAU;
    if (Math.sin(a - yaw) > 0.15) continue;
    var q = pw(Math.cos(a)*1.02, 0.065, Math.sin(a)*1.02), pr = 0.052*S*q.p;
    ctx.beginPath(); ctx.arc(q.x, q.y, pr, 0, TAU); ctx.fillStyle = mul(K.drip, dim); ctx.fill();
    ctx.beginPath(); ctx.arc(q.x - pr*.3, q.y - pr*.3, pr*.3, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,' + (.5*dim) + ')'; ctx.fill();
  }
  /* frosting drips over the front edge */
  var n = 56, up = [], lo = [];
  for (i = 0; i <= n; i++){
    var b = Math.PI + i/n*Math.PI, wa = b + yaw;
    var d = (0.07 + 0.065*(0.5 + 0.5*Math.sin(wa*9)) + 0.03*Math.sin(wa*4 + 1))*Math.min(1, -Math.sin(b)*5);
    up.push(pc(Math.cos(b)*1.012, HT, Math.sin(b)*1.012));
    lo.push(pc(Math.cos(b)*1.012, HT - d, Math.sin(b)*1.012));
  }
  ctx.beginPath(); ctx.moveTo(up[0].x, up[0].y);
  for (i = 1; i <= n; i++) ctx.lineTo(up[i].x, up[i].y);
  for (i = n; i >= 0; i--) ctx.lineTo(lo[i].x, lo[i].y);
  ctx.closePath(); ctx.fillStyle = mul(K.drip, dim*.95); ctx.fill();
  poly(ringC(0.93, HT)); ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.lineWidth = 1.5; ctx.stroke();
  /* contact shadows and pools of candle light on the top face */
  ctx.save(); poly(ringC(1, HT)); ctx.clip();
  for (i = 0; i < N; i++){
    var c = candles[i], bp = pw(c.x, HT, c.z);
    ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.beginPath(); ctx.ellipse(bp.x, bp.y, S*0.06*bp.p, S*0.06*bp.p*SP, 0, 0, TAU); ctx.fill();
    if (c.lit){
      var kk = Math.min(1, igk(c, now)), R = S*0.36*bp.p;
      ctx.save(); ctx.translate(bp.x, bp.y); ctx.scale(1, SP);
      g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
      g.addColorStop(0, 'rgba(255,196,96,' + (.26*kk) + ')'); g.addColorStop(1, 'rgba(255,196,96,0)');
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill(); ctx.restore();
    }
  }
  ctx.restore();
  /* candles, far ones first */
  var order = [];
  for (i = 0; i < N; i++) order.push({ i: i, z: pw(candles[i].x, HT, candles[i].z).z });
  order.sort(function(p1, p2){ return p2.z - p1.z; });
  var cols = [K.c1, K.c2, K.c3], cdim = 0.62 + 0.38*glow;
  for (var o = 0; o < N; o++){
    var cd = candles[order[o].i], idx = order[o].i;
    var b0 = pw(cd.x, HT, cd.z), t1 = pw(cd.x, HT + cd.h, cd.z), w = Math.max(3, 0.054*S*b0.p);
    ctx.lineCap = 'butt';
    ctx.strokeStyle = mul(cols[cd.ci], cdim); ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(b0.x, b0.y); ctx.lineTo(t1.x, t1.y); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.34)'; ctx.lineWidth = w*.26; ctx.beginPath(); ctx.moveTo(b0.x - w*.2, b0.y); ctx.lineTo(t1.x - w*.2, t1.y); ctx.stroke();
    ctx.fillStyle = mul(cols[cd.ci], Math.min(1.25, cdim*1.15)); ctx.beginPath(); ctx.ellipse(t1.x, t1.y, w/2, w/2*SP, 0, 0, TAU); ctx.fill();
    var wk = pw(cd.x, HT + cd.h + 0.045, cd.z);
    ctx.strokeStyle = '#2b2118'; ctx.lineWidth = Math.max(1, w*.2); ctx.beginPath(); ctx.moveTo(t1.x, t1.y); ctx.lineTo(wk.x, wk.y); ctx.stroke();
    if (cd.lit){
      var kf = igk(cd, now), fl = reduce ? 1 : 1 + 0.09*Math.sin(now*0.013 + idx*1.7) + 0.05*Math.sin(now*0.031 + idx);
      var fs = 0.036*S*wk.p*kf*fl, sway = reduce ? 0 : Math.sin(now*0.007 + idx*2.1)*fs*.35;
      if (fs > 0.2) flame(wk.x, wk.y - fs*.3, fs, sway);
    }
  }
  for (i = sparks.length - 1; i >= 0; i--){
    var sp = sparks[i]; sp.x += sp.vx; sp.y += sp.vy; sp.vy += 0.12; sp.life -= 0.03;
    if (sp.life <= 0){ sparks.splice(i, 1); continue; }
    ctx.fillStyle = 'rgba(255,214,120,' + sp.life + ')'; ctx.beginPath(); ctx.arc(sp.x, sp.y, 1.6, 0, TAU); ctx.fill();
  }
}

/* ---------- one press lights all 26 candles, one after another ---------- */
var hudCount = $('hudCount'), lightBtn = $('lightBtn');
function updateHud(){ hudCount.innerHTML = pad(lit) + ' <small>/ 26 NẾN</small>'; }
function igniteOne(i){
  var c = candles[i]; c.lit = true; c.t0 = performance.now(); lit++; updateHud();
  if (reduce) return;
  var p = pw(c.x, HT + c.h + 0.1, c.z);
  for (var k = 0; k < 9; k++){ var a = Math.random()*TAU, v = 0.6 + Math.random()*2; sparks.push({ x: p.x, y: p.y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 1.2, life: 1 }); }
}
function lightAll(){
  if (busy) return;
  busy = true; lightBtn.disabled = true; lightBtn.textContent = 'Đang thắp nến…';
  var step = reduce ? 30 : 240;
  if (!reduce) tw = { from: yawBase, to: yawBase + TAU, t0: performance.now(), dur: step*N + 900 };
  for (var i = 0; i < N; i++) (function(i){ later(function(){ igniteOne(i); }, 300 + i*step); })(i);
  later(function(){ lightBtn.textContent = 'Đủ 26 ngọn nến'; }, 300 + N*step);
  later(showMemo, 300 + N*step + (reduce ? 700 : 2400));
}

/* ---------- film scene: the roll advances by itself, one photo at a time ---------- */
var film = $('film'), track = $('track'), pCount = $('pCount'), pCap = $('pCap'), capSpan = pCap.firstChild;
var prevBtn = $('prevBtn'), nextBtn = $('nextBtn'), barFill = $('barFill');
var frames = [], cur = -1, autoT = 0, capT = 0;
for (var f = 0; f < M; f++){ var el = document.createElement('div'); el.className = 'frame'; track.appendChild(el); frames.push(el); }
function fillFrames(){
  for (var k = 0; k < M; k++){
    if (frames[k].firstChild) continue;
    var bl = document.createElement('div'); bl.className = 'blur'; bl.style.backgroundImage = 'url(' + tsrc(k) + ')';
    var im = new Image(); im.alt = 'Ảnh kỷ niệm ' + pad(k + 1); im.src = src(k);
    frames[k].appendChild(bl); frames[k].appendChild(im);
  }
}
function offsetFor(i){ var fw = frames[0].offsetWidth; return film.clientWidth/2 - (12 + i*(fw + 12) + fw/2); }
function dwell(i){ var t = PHOTOS[i].text || ''; return t ? Math.min(10000, 3200 + t.length*70) : 4200; }
function go(i, fromRight){
  cur = i;
  for (var k = 0; k < M; k++) frames[k].classList.toggle('on', k === i);
  pCount.textContent = pad(i + 1) + ' / ' + pad(M);
  prevBtn.disabled = i === 0;
  nextBtn.setAttribute('aria-label', i === M - 1 ? 'Tới phần kết' : 'Ảnh tiếp theo');
  if (fromRight){ track.style.transition = 'none'; track.style.transform = 'translateX(' + offsetFor(i - 1) + 'px)'; void track.offsetWidth; }
  track.style.transition = '';
  track.style.transform = 'translateX(' + offsetFor(i) + 'px)';
  clearTimeout(capT); clearTimeout(autoT);
  pCap.classList.remove('show');
  var txt = PHOTOS[i].text || '';
  capT = setTimeout(function(){ capSpan.textContent = txt; capSpan.style.display = txt ? '' : 'none'; if (txt) pCap.classList.add('show'); }, reduce ? 0 : 650);
  var ms = dwell(i);
  barFill.classList.remove('run'); void barFill.offsetWidth; barFill.style.animationDuration = ms + 'ms'; barFill.classList.add('run');
  autoT = setTimeout(next, ms);
}
function next(){ if (scene !== 'film') return; if (cur >= M - 1) runFinale(); else go(cur + 1); }
function prev(){ if (scene !== 'film' || cur <= 0) return; go(cur - 1); }
function showMemo(){ fillFrames(); setScene('memo'); later(startFilm, reduce ? 1800 : 3600); }
function startFilm(){ setScene('film'); go(0, true); }
nextBtn.addEventListener('click', next); prevBtn.addEventListener('click', prev);
if (!PHOTOS.some(function(p){ return p.text; })) pCap.style.display = 'none';   /* no captions at all: close the gap */

/* ---------- finale: fireworks, then 26 tiles (one per candle) form a heart ---------- */
var finaleEl = $('finale'), heart = $('heart');
var thumbs = [], parts = [], fxOn = false, fxStart = 0, fxNext = 0;
function heartPts(n){
  var P = [], Mx = 720, L = [0], out = [], i, j = 0, t0 = 0.51;
  for (i = 0; i <= Mx; i++){ var t = t0 + i/Mx*(TAU - 2*t0); P.push([16*Math.pow(Math.sin(t), 3), 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)]); }
  for (i = 1; i <= Mx; i++) L.push(L[i-1] + Math.hypot(P[i][0] - P[i-1][0], P[i][1] - P[i-1][1]));
  for (var k = 0; k < n; k++){ var d = L[Mx]*k/(n - 1); while (j < Mx - 1 && L[j+1] < d) j++; out.push(P[j]); }
  return out;
}
var HP = heartPts(N);
for (var h = 0; h < N; h++){ var th = document.createElement('div'); th.className = 'thumb'; heart.appendChild(th); thumbs.push(th); }
function fillThumbs(){ for (var k = 0; k < N; k++){ if (thumbs[k].firstChild) continue; var im = new Image(); im.alt = ''; im.src = tsrc(k % M); thumbs[k].appendChild(im); } }
function burst(x, y, col){
  for (var i = 0; i < 56; i++){ var a = Math.random()*TAU, v = (0.35 + Math.random())*3.6; parts.push({ x: x, y: y, px: x, py: y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 1, dec: 0.010 + Math.random()*0.012, col: col }); }
}
function fxLoop(now){
  if (!fxOn) return;
  fctx.clearRect(0, 0, W, H);
  if (now > fxNext && !reduce){
    var cols = [K.hi, '#F5F0E6', '#ff5a4d', '#ffd166', '#7cc6ff'];
    burst(W*(0.15 + Math.random()*0.7), H*(0.12 + Math.random()*0.45), cols[Math.floor(Math.random()*cols.length)]);
    fxNext = now + (now - fxStart < 4500 ? 360 : 1400) + Math.random()*300;
  }
  fctx.globalCompositeOperation = 'lighter'; fctx.lineCap = 'round'; fctx.lineWidth = 2.6;
  for (var i = parts.length - 1; i >= 0; i--){
    var p = parts[i]; p.px = p.x; p.py = p.y; p.x += p.vx; p.y += p.vy; p.vx *= 0.985; p.vy = p.vy*0.985 + 0.045; p.life -= p.dec;
    if (p.life <= 0){ parts.splice(i, 1); continue; }
    fctx.globalAlpha = Math.max(0, p.life); fctx.strokeStyle = p.col;
    fctx.beginPath(); fctx.moveTo(p.px, p.py); fctx.lineTo(p.x, p.y); fctx.stroke();
  }
  fctx.globalAlpha = 1;
  requestAnimationFrame(fxLoop);
}
function runFinale(){
  clearTimeout(autoT); clearTimeout(capT);
  fillThumbs(); setScene('finale');
  finaleEl.classList.remove('go', 'done');
  for (var k = 0; k < N; k++){ var s = thumbs[k].style; s.transitionDelay = '0s'; s.left = '50%'; s.top = '50%'; s.opacity = 0; s.transform = 'translate(-50%,-50%) scale(.1)'; }
  parts = []; fxOn = true; fxStart = performance.now(); fxNext = 0; requestAnimationFrame(fxLoop);
  later(function(){ finaleEl.classList.add('go'); }, 300);
  later(function(){
    for (var k2 = 0; k2 < N; k2++){
      var st = thumbs[k2].style, rot = ((k2*37) % 17) - 8;
      st.transitionDelay = (reduce ? 0 : k2*0.085) + 's';
      st.left = (50 + HP[k2][0]/16*43) + '%'; st.top = (50 - (HP[k2][1] + 2.5)/14.5*43) + '%';
      st.opacity = 1; st.transform = 'translate(-50%,-50%) rotate(' + rot + 'deg)';
    }
  }, reduce ? 400 : 2600);
  later(function(){ finaleEl.classList.add('done'); }, reduce ? 800 : 6600);
}
function resetAll(){
  timers.forEach(clearTimeout); timers = []; clearTimeout(autoT); clearTimeout(capT);
  fxOn = false; parts = []; fctx.clearRect(0, 0, W, H);
  for (var i = 0; i < N; i++) candles[i].lit = false;
  lit = 0; busy = false; yawBase = 0; tw = null; cur = -1;
  lightBtn.disabled = false; lightBtn.textContent = 'Thắp nến'; updateHud();
  finaleEl.classList.remove('go', 'done');
  setScene('intro');
}

/* ---------- controls ---------- */
function start(){ setScene('cake'); for (var k = 0; k < M; k++){ new Image().src = src(k); new Image().src = tsrc(k); } }
$('startBtn').addEventListener('click', start);
lightBtn.addEventListener('click', lightAll);
$('againBtn').addEventListener('click', resetAll);
document.addEventListener('keydown', function(e){
  if (scene === 'film' && e.key === 'ArrowRight'){ next(); return; }
  if (scene === 'film' && e.key === 'ArrowLeft'){ prev(); return; }
  if (e.key !== ' ' && e.key !== 'Enter') return;
  if (e.target && e.target.tagName === 'BUTTON') return;
  e.preventDefault();
  if (scene === 'intro') start(); else if (scene === 'cake') lightAll(); else if (scene === 'film') next();
});
var drag = null;
cv.addEventListener('pointerdown', function(e){ if (scene !== 'cake' || tw) return; drag = { x: e.clientX, y0: yawBase }; try { cv.setPointerCapture(e.pointerId); } catch (err) {} cv.style.cursor = 'grabbing'; });
cv.addEventListener('pointermove', function(e){ if (!drag || tw) return; yawBase = drag.y0 - (e.clientX - drag.x)*0.009; });
function endDrag(){ drag = null; cv.style.cursor = 'grab'; }
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

window.addEventListener('resize', resize);
resize(); updateHud();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
(function loop(now){
  if (scene === 'cake' || now < keepDraw) drawCake(now);
  requestAnimationFrame(loop);
})(performance.now());
})();
</script>
</body>
</html>
